name: Inventory production storage (read-only)

run-name: Production storage inventory requested by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INVENTORY to confirm a read-only production inspection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: digitaldot-production-storage-inventory
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate inventory request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the explicit inventory token
        env:
          INVENTORY_CONFIRMATION: ${{ inputs.confirmation }}
          INVENTORY_REF: ${{ github.ref }}
        run: |
          if [ "$INVENTORY_REF" != "refs/heads/main" ]; then
            echo "Inventory refused: select the main branch." >&2
            exit 1
          fi

          if [ "$INVENTORY_CONFIRMATION" != "INVENTORY" ]; then
            echo "Inventory refused: enter the exact confirmation token." >&2
            exit 1
          fi

  inventory:
    name: Read-only production inventory
    needs: validate-request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      deployment: false

    steps:
      - name: Check out the reviewed inventory scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and encode the reviewed payload
        id: inventory-payload
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Inventory refused: checked-out SHA mismatch." >&2
            exit 1
          fi

          openssl x509 \
            -in ops/production-inventory-recipient.pem \
            -noout \
            -checkend 86400

          encoded_script="$(base64 -w 0 scripts/report-production-storage.mjs)"
          encoded_certificate="$(base64 -w 0 ops/production-inventory-recipient.pem)"
          script_sha="$(sha256sum scripts/report-production-storage.mjs | awk '{print $1}')"
          certificate_sha="$(sha256sum ops/production-inventory-recipient.pem | awk '{print $1}')"

          echo "script=$encoded_script" >> "$GITHUB_OUTPUT"
          echo "certificate=$encoded_certificate" >> "$GITHUB_OUTPUT"
          echo "script_sha=$script_sha" >> "$GITHUB_OUTPUT"
          echo "certificate_sha=$certificate_sha" >> "$GITHUB_OUTPUT"

      - name: Verify the pinned SSH host identity
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ secrets.PRODUCTION_INVENTORY_HOST_FINGERPRINT }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_INVENTORY_HOST }}
        run: |
          set -euo pipefail

          if [[ ! "$PRODUCTION_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]{0,252}$ ]]; then
            echo "Inventory refused: the production host is missing or invalid." >&2
            exit 1
          fi

          inventory_temp_prefix="$RUNNER_TEMP/digitaldot-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          observed_host_keys="${inventory_temp_prefix}.known-hosts"
          umask 077

          if ! ssh-keyscan -T 10 -p 22 -t ed25519 "$PRODUCTION_HOST" \
            > "$observed_host_keys" 2>/dev/null; then
            echo "Inventory refused: the server ED25519 key could not be observed." >&2
            exit 1
          fi

          observed_fingerprint=""
          while IFS= read -r host_key_line; do
            current_fingerprint="$(
              printf '%s\n' "$host_key_line" \
                | ssh-keygen -lf - -E sha256 \
                | awk 'NR == 1 { print $2 }'
            )"

            if [[ ! "$current_fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
              echo "Inventory refused: an observed host key is malformed." >&2
              exit 1
            fi

            if [ -z "$observed_fingerprint" ]; then
              observed_fingerprint="$current_fingerprint"
            elif [ "$observed_fingerprint" != "$current_fingerprint" ]; then
              echo "Inventory refused: the host returned multiple ED25519 identities." >&2
              exit 1
            fi
          done < "$observed_host_keys"

          if [ -z "$observed_fingerprint" ]; then
            echo "Inventory refused: no ED25519 host key was returned." >&2
            exit 1
          fi

          if [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "Inventory paused: independently verify and then save this public fingerprint as the production Environment secret PRODUCTION_INVENTORY_HOST_FINGERPRINT:"
            echo "$observed_fingerprint"
            exit 1
          fi

          if [[ ! "$EXPECTED_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "Inventory refused: the pinned host fingerprint is malformed." >&2
            exit 1
          fi

          if [ "$observed_fingerprint" != "$EXPECTED_FINGERPRINT" ]; then
            echo "Inventory refused: the SSH host fingerprint does not match the pinned value." >&2
            echo "Observed public fingerprint: $observed_fingerprint" >&2
            exit 1
          fi

          chmod 600 "$observed_host_keys"

      - name: Inspect production and emit only the encrypted report
        shell: bash
        env:
          INVENTORY_CERT_B64: ${{ steps.inventory-payload.outputs.certificate }}
          INVENTORY_CERT_SHA256: ${{ steps.inventory-payload.outputs.certificate_sha }}
          INVENTORY_SCRIPT_B64: ${{ steps.inventory-payload.outputs.script }}
          INVENTORY_SCRIPT_SHA256: ${{ steps.inventory-payload.outputs.script_sha }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_INVENTORY_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_INVENTORY_SSH_KEY }}
          PRODUCTION_USERNAME: ${{ secrets.PRODUCTION_INVENTORY_USERNAME }}
        run: |
          set -euo pipefail

          if [[ ! "$PRODUCTION_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]{0,252}$ ]]; then
            echo "Inventory refused: the production host is missing or invalid." >&2
            exit 1
          fi

          if [[ ! "$PRODUCTION_USERNAME" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "Inventory refused: the production username is missing or invalid." >&2
            exit 1
          fi

          if [[ ! "$INVENTORY_SCRIPT_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || \
             [[ ! "$INVENTORY_CERT_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || \
             [[ ! "$INVENTORY_SCRIPT_SHA256" =~ ^[a-f0-9]{64}$ ]] || \
             [[ ! "$INVENTORY_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Inventory refused: the reviewed payload is malformed." >&2
            exit 1
          fi

          inventory_temp_prefix="$RUNNER_TEMP/digitaldot-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          observed_host_keys="${inventory_temp_prefix}.known-hosts"
          identity_file="${inventory_temp_prefix}.identity"
          remote_output_file="${inventory_temp_prefix}.output"
          maximum_output_bytes=262144

          cleanup_inventory_credentials() {
            rm -f -- "$observed_host_keys" "$identity_file" "$remote_output_file"
          }
          trap cleanup_inventory_credentials EXIT
          umask 077

          if [ ! -f "$observed_host_keys" ] || [ -L "$observed_host_keys" ]; then
            echo "Inventory refused: the verified host-key file is unavailable." >&2
            exit 1
          fi

          if [ -z "$PRODUCTION_SSH_KEY" ]; then
            echo "Inventory refused: the production SSH key is unavailable." >&2
            exit 1
          fi

          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$identity_file"
          unset PRODUCTION_SSH_KEY
          chmod 600 "$identity_file" "$observed_host_keys"

          set +e
          {
            printf 'INVENTORY_CERT_B64=%q\n' "$INVENTORY_CERT_B64"
            printf 'INVENTORY_CERT_SHA256=%q\n' "$INVENTORY_CERT_SHA256"
            printf 'INVENTORY_SCRIPT_B64=%q\n' "$INVENTORY_SCRIPT_B64"
            printf 'INVENTORY_SCRIPT_SHA256=%q\n' "$INVENTORY_SCRIPT_SHA256"
            cat scripts/run-production-storage-inventory.sh
          } | ssh \
            -T \
            -p 22 \
            -i "$identity_file" \
            -l "$PRODUCTION_USERNAME" \
            -o BatchMode=yes \
            -o CheckHostIP=no \
            -o ConnectTimeout=10 \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o IdentitiesOnly=yes \
            -o KbdInteractiveAuthentication=no \
            -o LogLevel=ERROR \
            -o PasswordAuthentication=no \
            -o PreferredAuthentications=publickey \
            -o ServerAliveCountMax=2 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$observed_host_keys" \
            "$PRODUCTION_HOST" \
            '/usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME="$HOME" /bin/bash --noprofile --norc -s' \
            2>&1 \
            | head -c "$((maximum_output_bytes + 1))" > "$remote_output_file"
          remote_status=$?
          set -e

          if [ "$remote_status" -ne 0 ]; then
            echo "Inventory failed safely: the protected SSH inspection did not complete." >&2
            exit 1
          fi

          output_size="$(wc -c < "$remote_output_file")"
          if [ "$output_size" -gt "$maximum_output_bytes" ]; then
            echo "Inventory failed safely: remote output exceeded the protected limit." >&2
            exit 1
          fi

          mapfile -t remote_lines < "$remote_output_file"
          if [ "${#remote_lines[@]}" -ne 1 ]; then
            echo "Inventory failed safely: remote output was not one encrypted report." >&2
            exit 1
          fi

          remote_line="${remote_lines[0]}"
          if [[ ! "$remote_line" =~ ^DIGITALDOT_INVENTORY_CMS_DER_BASE64=([A-Za-z0-9+/]+={0,2})$ ]]; then
            echo "Inventory failed safely: remote output was not one encrypted report." >&2
            exit 1
          fi

          encrypted_report="${BASH_REMATCH[1]}"
          if [ "${#encrypted_report}" -lt 128 ]; then
            echo "Inventory failed safely: the encrypted report was incomplete." >&2
            exit 1
          fi

          printf '%s\n' "$remote_line"
